# Источник данных Grafana: та же PostgreSQL, что и у API (значения — из env контейнера grafana).
apiVersion: 1
datasources:
  - name: Mise PostgreSQL
    uid: mise-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    # Роль только на чтение (создаёт API, без доступа к users/refresh_tokens).
    user: ${GF_DB_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GF_DB_PASSWORD}
