# SPA + обратный прокси на API (один origin → без CORS). Шаблон: официальный образ nginx подставляет
# переменные окружения при старте — ${PORT} (порт контейнера; Render задаёт свой) и ${API_UPSTREAM}
# (compose: http://api:8080; Render: https://<api>.onrender.com — бесплатные сервисы не принимают внутренний трафик).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API отдаёт свои заголовки безопасности сам (у Swagger — свой CSP).
  # X-Forwarded-For дописывается: API доверяет только последнему звену (ForwardedHeaders:ForwardLimit) — подменить IP нельзя.
  location ~ ^/(api|health|swagger)(/|$) {
    proxy_pass ${API_UPSTREAM};
    # Host — адрес API (по нему маршрутизирует балансировщик платформы), исходный — в X-Forwarded-Host.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hubs/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Манифест PWA: в mime.types nginx нет .webmanifest, а с nosniff браузер может не принять octet-stream.
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Service worker и index.html — всегда свежие: иначе обновление приложения не дойдёт до телефонов.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
