# Заголовки безопасности SPA. Подключается в server и в каждый location со своим add_header:
# в nginx add_header внутри location отменяет заголовки уровня server.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Chakra (emotion) вставляет стили в <style> — 'unsafe-inline' только для стилей; скрипты — только свои.
# connect-src 'self' покрывает REST и WebSocket SignalR того же origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
