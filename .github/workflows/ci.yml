name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test (unit + Testcontainers)
        run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Тесты входят под каждой ролью много раз — лимит входов с одного IP для прогона поднят (в проде он 10/мин).
      LOGIN_PER_MINUTE: '300'
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build --wait postgres redis api web
          # API применяет миграции при старте — ждём, пока /health ответит через nginx.
          for i in $(seq 1 60); do curl -fsS http://localhost:8081/health >/dev/null && exit 0; sleep 2; done
          docker compose logs api --tail 100; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        working-directory: web
        run: npm run e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs api --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
