# Прод-конфигурация поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Секреты обязательны (compose остановится с ошибкой, если их нет) — задайте в .env или окружении.
# Наружу смотрят только web (SPA + прокси на API) и grafana; API, Postgres и Redis — во внутренней сети.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mise};Username=${POSTGRES_USER:-mise};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY is required (openssl rand -base64 48)}
      # Пуши: без ключа выключены (приложение работает, просто без уведомлений на телефон).
      Push__PrivateKey: ${PUSH_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_SUBJECT:-mailto:admin@mise.local}
      Auth__DemoUsersPassword: ${DEMO_PASSWORD:?DEMO_PASSWORD is required}
      Auth__SimulatorPassword: ${SIMULATOR_PASSWORD:?SIMULATOR_PASSWORD is required}
      Auth__CookieSecure: ${AUTH_COOKIE_SECURE:-true}
      Database__ReadOnlyPassword: ${DB_READONLY_PASSWORD:?DB_READONLY_PASSWORD is required}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      ForwardedHeaders__TrustAllProxies: "true"
      ForwardedHeaders__ForwardLimit: ${FORWARD_LIMIT:-1}
      Security__Hsts: ${HSTS_ENABLED:-true}

  simulator:
    environment:
      Simulator__Password: ${SIMULATOR_PASSWORD:?SIMULATOR_PASSWORD is required}

  grafana:
    environment:
      GF_DB_PASSWORD: ${DB_READONLY_PASSWORD:?DB_READONLY_PASSWORD is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_SECURITY_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
