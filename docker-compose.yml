name: mise

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mise}
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mise_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Mise.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mise};Username=${POSTGRES_USER:-mise};Password=${POSTGRES_PASSWORD:-mise_dev_password}
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      Database__MigrateOnStartup: "true"
      Seed__Enabled: ${SEED_ENABLED:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Expiry__Enabled: ${EXPIRY_ENABLED:-true}
      Expiry__IntervalSeconds: ${EXPIRY_INTERVAL_SECONDS:-30}
      Expiry__AutoWriteOff: ${EXPIRY_AUTO_WRITE_OFF:-true}
      Demo__Enabled: ${DEMO_ENABLED:-true}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: src/Mise.Simulator/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Redis: redis:6379
      Simulator__ApiBaseUrl: http://api:8080
      Simulator__AutoStart: ${SIMULATOR_AUTOSTART:-false}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
