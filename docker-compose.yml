name: mise

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mise}
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mise_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Mise.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mise};Username=${POSTGRES_USER:-mise};Password=${POSTGRES_PASSWORD:-mise_dev_password}
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      Database__MigrateOnStartup: "true"
      Seed__Enabled: ${SEED_ENABLED:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Expiry__Enabled: ${EXPIRY_ENABLED:-true}
      Expiry__IntervalSeconds: ${EXPIRY_INTERVAL_SECONDS:-30}
      Expiry__AutoWriteOff: ${EXPIRY_AUTO_WRITE_OFF:-true}
      Demo__Enabled: ${DEMO_ENABLED:-true}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-dev-only-signing-key-not-for-production-0123456789}
      # Пуши на телефон (Web Push, VAPID). Ключ по умолчанию — только для локального стека, как и ключ подписи выше.
      Push__PrivateKey: ${PUSH_PRIVATE_KEY:-vv04sIyZIHhKKq2ParrIW3gAOiGYi_EJDV1na5W1RKc}
      Push__Subject: ${PUSH_SUBJECT:-mailto:admin@mise.local}
      # Входов в минуту с одного IP (защита от перебора). Для прогона e2e поднимают: LOGIN_PER_MINUTE=300.
      RateLimiting__LoginPerMinute: ${LOGIN_PER_MINUTE:-10}
      Auth__DemoUsersPassword: ${DEMO_PASSWORD:-mise-demo}
      Auth__SimulatorPassword: ${SIMULATOR_PASSWORD:-mise-simulator}
      Auth__CookieSecure: ${AUTH_COOKIE_SECURE:-false}
      ForwardedHeaders__TrustAllProxies: ${TRUST_PROXY_HEADERS:-true}
      Database__ReadOnlyUser: ${DB_READONLY_USER:-mise_readonly}
      Database__ReadOnlyPassword: ${DB_READONLY_PASSWORD:-mise_readonly_dev}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: src/Mise.Simulator/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Redis: redis:6379
      Simulator__ApiBaseUrl: http://api:8080
      Simulator__AutoStart: ${SIMULATOR_AUTOSTART:-false}
      Simulator__Login: simulator
      Simulator__Password: ${SIMULATOR_PASSWORD:-mise-simulator}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mise}
      GF_DB_USER: ${DB_READONLY_USER:-mise_readonly}
      GF_DB_PASSWORD: ${DB_READONLY_PASSWORD:-mise_readonly_dev}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/stock.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      # Роль только на чтение создаёт API при старте.
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  grafanadata:
